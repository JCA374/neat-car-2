id = "n04_long_episodes"
model = "neat"
parent = "n02_forward_rays"
title = "2000-frame training episodes"
why = """
Training episodes stopped at 1000 frames (20 s), but n02 needs 19-28 s per lap, so on long tracks a lap was never
finished during training and finishing it was never rewarded. The benchmark allows 2000 frames. Here training
and validation get 2000 frames too. Cars that stop making progress are still cut off after 100 frames, so the extra
time is only spent on cars that keep driving. Everything else as n02.
"""
lidar_rays = 16
lidar_fov = 240

outcome = """
Finishes all five tracks about 1 s per lap faster than n02 (22.1 s vs 23.2 s), with a smaller network (4 hidden, 62 links) and almost no time on the grass. The longer episodes cost training time: 1 h 45 min instead of 47 min. The best generation was 98 of 100, so it was probably still improving.
"""
[train]
generations = 100
tracks-per-generation = 3
lap-time-bonus = 1.0
max-steps = 2000
