# What the ladder has taught us so far. Shown on the Overview and Championship tabs
# (scripts/build_site.py -> docs/assets/data/findings.json). Each finding links to the steps that show it.

[[finding]]
title = "NEAT is the reliable one on a laptop CPU"
text = "Every NEAT step from n02 on finishes all five tracks. PPO's best so far finishes three, but when it does it is fast. NEAT evaluates 100 small networks in parallel on all cores; PPO trains one big network and is very sensitive to how the reward is shaped."
steps = ["n02_forward_rays", "n05_more_generations", "p06_rays_only"]

[[finding]]
title = "Look forward, not around"
text = "The original 32 rays fanned 324° around the car's right side: 13 pointed backwards and the left side was blind. 16 rays facing forward over ±120° finished every track with half the inputs, and the run took a fifth of the training time. For PPO the same change took it from 1 to 3 finished tracks."
steps = ["n00_baseline", "n02_forward_rays", "p05_control", "p06_rays_only"]

[[finding]]
title = "Train the way you're tested"
text = "Training episodes stopped at 20 s, but long tracks take 25 s, so finishing them was never rewarded. With 40 s training episodes (the same as the benchmark) laps got about 1 s faster and the car stopped leaving the road."
steps = ["n02_forward_rays", "n04_long_episodes"]

[[finding]]
title = "More generations help, up to a point"
text = "Doubling to 200 generations gave the fastest NEAT car yet (20.4 s), beating the baseline with about 45% less training. The best network came from generation 117; the rest of the run added nothing."
steps = ["n04_long_episodes", "n05_more_generations"]

[[finding]]
title = "Too simple doesn't drive"
text = "Starting with no connections at all evolved a tiny 8-link network that got round 98% of the track but never crossed the line. Speed rewards alone also backfired: the car got faster but left the road on two tracks."
steps = ["n03_sparse_start", "n01_lap_time"]

[[finding]]
title = "PPO breaks easily on rewards"
text = "A per-frame grass penalty made PPO creep at walking pace. Ending episodes early when the car stopped making progress was worse: three one-change checks showed it is the culprit, because PPO never got to practise getting back on the road. Without it, and with forward rays, PPO finishes 3 of 5 tracks and sets the fastest lap of any model (16.8 s)."
steps = ["p01_lap_time", "p05_control", "p06_rays_only", "p07_stuck_only"]

[[finding]]
title = "Fast and safe pull against each other"
text = "In the Championship, NEAT Smart's stronger speed bonus produced the quickest laps of any car (16.4 s) but a car that crashes out on three of five tracks. NEAT 16, with the gentler bonus, laps 4 s slower but finishes everywhere. More rays (NEAT 32) also bought speed, at four times the training."
steps = ["neatsmart", "neat16", "neat32"]
