id = "p16_raw3_r4_g995_lap_bonus"
model = "ppo"
parent = "p14_raw3_r4_g995"
title = "A lap-time bonus"
why = """
A lap-time bonus. Same as p14 plus +1 per frame a lap beats 1000 frames, the bonus the NEAT cars train with: does it make PPO faster without crashing?
The PPO lab (scripts/ppo_lab.py, short 600k-frame runs on 3 seeds, validation tracks only) found that PPO deciding every frame never learns to finish, in any control mode. Recipe 'raw3_r4_g995' scored best (seed 0: best 5/5, final 2/5, seed 1: best 5/5, final 2/5, seed 2: best 5/5, final 5/5). This step trains it for 3M frames on two seeds, benchmarked like every other step.
"""
lidar_rays = 16
lidar_fov = 240
action_smoothing = 0.1
controls = "raw3"
action_repeat = 4
seeds = [0, 1]

outcome = """
Seed 0 4/5, seed 1 3/5. Seed 0 kept the same checkpoint as p14 (the bonus only pays for laps under 20 s, which it didn't drive yet at 13 min); later it held 5/5 on validation less often (7% of lap checks against 28%). As with NEAT Smart, the speed bonus makes the car less reliable, so the PPO cars train without it.
"""

[train]
entropy-coef = 0.005
normalize-reward = true
num-envs = 8
batch-size = 256
offtrack-penalty = 0.0
allow-multiple-laps = false
max-episode-steps = 2000
eval-frequency = 0
checkpoint-frequency = 0
lap-check-frequency = 25000
n-steps = 256
gamma = 0.995
lap-time-bonus = 1.0
total-timesteps = 3000000
