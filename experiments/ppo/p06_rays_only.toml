id = "p06_rays_only"
model = "ppo"
parent = "p05_control"
title = "Check: control + 16 forward rays"
why = """
Second check: the control recipe with only the 16 forward rays added. If p05 learns and this doesn't, the ray
change is what hurts PPO.
"""
lidar_rays = 16
lidar_fov = 240

outcome = """
The best PPO model yet: 3/5 tracks, 18.4 s mean lap, and 16.8 s on track 3, the fastest lap any model has driven. No grass on the tracks it finishes. Forward rays help PPO as much as NEAT: best evaluation 896 vs 558 for the control.
"""
[train]
total-timesteps = 600000
num-envs = 4
n-steps = 1024
batch-size = 256
entropy-coef = 0.005
offtrack-penalty = 0.0
allow-multiple-laps = false
eval-frequency = 25000
checkpoint-frequency = 100000
