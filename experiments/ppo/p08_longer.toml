id = "p08_longer"
model = "ppo"
parent = "p06_rays_only"
title = "Train longer, with the learning rate easing off"
why = """
p06 was still noisy after 600k steps. Here it trains for 1.5M steps, with the learning rate decaying to zero over the
run so the policy settles instead of collapsing late (as p00's longer run did). Everything else as p06.
"""
lidar_rays = 16
lidar_fov = 240

outcome = """
Worse than p06: 0/5 tracks. Its evaluation reward never got above about 420 (p06 reached 896). Apart from the longer run, only the learning-rate schedule differs, and the two runs split apart within minutes: a single PPO run depends a lot on luck. This led to the fair-rules rework (p10), with two seeds for every PPO step from now on.
"""
[train]
total-timesteps = 1500000
lr-schedule = "linear"
num-envs = 4
n-steps = 1024
batch-size = 256
entropy-coef = 0.005
offtrack-penalty = 0.0
allow-multiple-laps = false
eval-frequency = 25000
checkpoint-frequency = 100000
