id = "neatsmart"
model = "neat"
championship = true
parent = "neat16"
title = "NEAT Smart: every lesson at once"
why = """
NEAT 16 plus three lessons from the ladder. (1) No compass inputs: cos/sin(heading) are useless on random tracks,
and in n00 evolution had already cut cos(heading) off. (2) Five tracks per generation instead of three, so a network
can't win by drawing easy tracks. (3) A stronger lap-time bonus (2 per frame) to push harder for speed.
"""
lidar_rays = 16
lidar_fov = 240
drop_heading = true

outcome = """
Two very different cars. After only 18 minutes it already finished all five race tracks (27 s laps), the best quickest-to-finish car. Its fastest checkpoint laps validation in 18.5 s and sets the quickest race laps of any car (16.4-16.6 s), but crashes out on 3 of 5 race tracks: the stronger speed bonus made it fast but fragile.
"""
[train]
generations = 1000
tracks-per-generation = 5
lap-time-bonus = 2.0
max-steps = 2000
max-hours = 8
