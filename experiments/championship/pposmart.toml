id = "pposmart"
model = "ppo"
championship = true
parent = "p15_raw3_r4_g995_32rays"
title = "PPO Smart: the steady one"
why = """
PPO 32 with a learning rate that eases off to zero over the run. Every PPO run so far slips back after its best lap
check (p15 seed 1 ended at 4/5); smaller and smaller updates should let it settle on a good driver instead of
wandering away from it. The lap-time bonus was not used: on the ladder it made PPO less reliable (p16), as it did
NEAT Smart. The schedule is sized for 8 hours (about 20M frames at PPO 32's pace on this laptop).
"""
lidar_rays = 32
lidar_fov = 240
action_smoothing = 0.1
controls = "raw3"
action_repeat = 4

outcome = """
The steady one, and the fastest Championship car that finishes every race track: 20.58 s on all five, 0.2 s quicker than NEAT 16 and almost never on the grass (0.2% of frames). The easing learning rate did what it was meant to: where PPO 32 fell apart after hour 2, PPO Smart got steadier, holding all five validation tracks in 59% of lap checks in its last hour against PPO 32's 0%. Its fastest checkpoint came at 5 h 21 min. The schedule was sized at 20M frames and finished after 6 h 25 min, under the 8 h budget. Its 4-minute checkpoint finishes 4 of 5 race tracks (34.3 s).
"""

[train]
entropy-coef = 0.005
normalize-reward = true
num-envs = 8
batch-size = 256
offtrack-penalty = 0.0
allow-multiple-laps = false
max-episode-steps = 2000
eval-frequency = 0
checkpoint-frequency = 0
lap-check-frequency = 25000
n-steps = 256
gamma = 0.995
max-hours = 8
total-timesteps = 20000000
lr-schedule = "linear"
